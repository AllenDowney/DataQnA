name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 1 * *"  # monthly, to catch breakage from new package versions
  workflow_dispatch:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the notebooks
        working-directory: nb
        run: pytest --nbmake --nbmake-timeout=900 *.ipynb
